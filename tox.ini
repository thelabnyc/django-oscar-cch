[tox]
isolated_build = True
toxworkdir={env:TOX_WORK_DIR:.tox}
envlist =
    py{313,314,315}-django{520,600,610}-oscar{42}

[testenv]
runner = uv-venv-runner
deps =
    django520: django>=5.2,<5.3
    django600: django>=6.0,<6.1
    django610: django>=6.1,<6.2
    oscar42: django-oscar>=4.2,<4.3
setenv =
    PYTHONWARNINGS = d
    DJANGO_SETTINGS_MODULE = sandbox.settings
    PYTHONPATH = {toxinidir}
changedir = {toxinidir}
commands =
    mypy oscarcch/ sandbox/
    coverage erase
    coverage run --source oscarcch -p manage.py test oscarcch --noinput
    - coverage combine
    - coverage report -m
